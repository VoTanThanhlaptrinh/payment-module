spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}      # bắt buộc, không có giá trị mặc định
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:true}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}

payment:
  providers:
    vnpay:
      enabled: true
      payment-url: ${VNPAY_PAYMENT_URL}
      return-url: ${VNPAY_RETURN_URL}
      ipn-url: ${VNPAY_IPN_URL}
      tmn-code: ${VNPAY_TMN_CODE}
      hash-secret: ${VNPAY_HASH_SECRET}
      version: "2.1.0"
      expiry-minutes: ${VNPAY_EXPIRY_MINUTES:15}
      # Đối soát BẬT mặc định: không có nó, payment bị bỏ dở nằm PENDING mãi và khoá order. Thiếu hai biến dưới thì app không khởi động.
      query-api-url: ${VNPAY_QUERY_API_URL}
      merchant-ip: ${VNPAY_MERCHANT_IP}
      reconciliation-enabled: ${VNPAY_RECONCILIATION_ENABLED:true}
      reconciliation-initial-delay: ${VNPAY_RECONCILIATION_INITIAL_DELAY:30s}
      reconciliation-interval: ${VNPAY_RECONCILIATION_INTERVAL:5m}
      reconciliation-not-found-grace: ${VNPAY_RECONCILIATION_NOT_FOUND_GRACE:5m}
      reconciliation-max-attempts: ${VNPAY_RECONCILIATION_MAX_ATTEMPTS:12}
      reconciliation-batch-size: ${VNPAY_RECONCILIATION_BATCH_SIZE:50}
      query-connect-timeout: ${VNPAY_QUERY_CONNECT_TIMEOUT:3s}
      query-read-timeout: ${VNPAY_QUERY_READ_TIMEOUT:5s}
