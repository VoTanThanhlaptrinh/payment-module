spring:
  application:
    name: payment

  # PostgreSQL & JPA Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/payment
    username: postgres
    password: 204863
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      # password: password_redis_if_any

  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Payment Providers
payment:
  providers:
    vnpay:
      enabled: true
      payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      return-url: http://localhost:8080/api/v1/payments/webhook/vnpay/return
      tmn-code: VNPAY_MOCK_TMN
      hash-secret: VNPAY_MOCK_SECRET
      version: 2.1.0
      expiry-minutes: 15
