spring:
  application:
    name: payment
  data:
    redis:
      timeout: 300ms        # Redis treo thì request lỗi nhanh (503) thay vì treo theo
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
payment:
  idempotency:
    in-progress-ttl: 30s    # key đang xử lý tự hết hạn nếu instance chết giữa chừng
    completed-ttl: 24h      # đã tạo thanh toán thành công: request lặp lại nhận kết quả cũ
    max-processing-time-seconds: 10   # timeout transaction tạo payment; in-progress-ttl phải >= 2 lần giá trị này
  providers:
    vnpay:
      enabled: false
      payment-url: ""
      return-url: ""
      ipn-url: ""
      tmn-code: ""
      hash-secret: ""
      version: "2.1.0"
      expiry-minutes: 15
      query-api-url: ""
      merchant-ip: ""
      reconciliation-enabled: false
      reconciliation-initial-delay: 30s
      reconciliation-interval: 5m
      reconciliation-not-found-grace: 5m   # QueryDR báo 91 sau expired_at + khoảng này thì chuyển giao dịch sang EXPIRED
      reconciliation-max-attempts: 12
      reconciliation-batch-size: 50
      query-connect-timeout: 3s
      query-read-timeout: 5s
